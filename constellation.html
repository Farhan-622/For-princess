<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Constellation</title>

<link rel="stylesheet" href="constellation.css">

</head>


<body>


<div class="sky"></div>



<div class="stars">


    <span class="star" data-memory="meeting">
        ✦
    </span>


    <span class="star" data-memory="conversation">
        ✦
    </span>


    <span class="star" data-memory="smile">
        ✦
    </span>


    <span class="star" data-memory="special">
        ✦
    </span>


</div>





<section class="content">


    <p class="chapter">
        CHAPTER THREE
    </p>


    <h1>
        Our Constellation
    </h1>


    <p class="quote">

        Every little moment became a star...
        <br>
        and together they formed a beautiful sky.

    </p>



    <div class="moon">
        🌙
    </div>


    <p class="hint">
        Click a star to open a memory
    </p>



</section>







<div class="memory-overlay" id="memoryOverlay">



    <div class="memory-card">



        <button id="close">
            ×
        </button>



        <img id="memoryImage" src="">



        <div class="memory-info">


            <h2 id="memoryTitle">
                Title
            </h2>


            <p id="memoryDescription">
                Description
            </p>


        </div>



    </div>


</div>





<button class="next" onclick="goNext()">

Continue →

</button>



<script src="constellation.js"></script>


</body>

</html>
